<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Clubhouse</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A0C0E">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="Clubhouse-tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen" class="wizard" style="display:none;">
  <div class="track">
    <p class="label">Sign in</p>
    <h1 class="title">Welcome to The Clubhouse</h1>
    <div class="field">
      <label class="label" for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com">
    </div>
    <button type="button" id="auth-send-btn" class="btn">Send magic link</button>
    <p id="auth-status" class="tiny" style="color:var(--muted);margin-top:12px;"></p>

    <div class="field" id="auth-code-field" style="display:none;">
      <label class="label" for="auth-code">Code</label>
      <input type="text" id="auth-code" inputmode="numeric" placeholder="8-digit code">
    </div>
    <button type="button" id="auth-verify-btn" class="btn" style="display:none;">Verify code</button>
  </div>
</div>

<div id="onboarding-screen" class="wizard" style="display:none;">
  <div class="track">
    <p class="label">Welcome</p>
    <h1 class="title">Which sports do you track?</h1>
    <div class="rail" id="onboard-sports" style="flex-wrap:wrap;">
      <button class="chip" data-sport-option="football" data-sport="football" aria-pressed="false">⚽ Football</button>
      <button class="chip" data-sport-option="cricket" data-sport="cricket" aria-pressed="false">🏏 Cricket</button>
      <button class="chip" data-sport-option="golf" data-sport="golf" aria-pressed="false">⛳ Golf</button>
      <button class="chip" data-sport-option="gym" data-sport="gym" aria-pressed="false">🏋️ Gym</button>
    </div>
    <button type="button" id="onboard-continue-btn" class="btn" style="margin-top:20px;">Continue</button>
    <p id="onboard-status" class="tiny" style="color:var(--muted);margin-top:12px;"></p>
  </div>
</div>

<div class="app">

    <header class="app-header">
        <p class="eyebrow" id="view-label">All sports</p>
        <h1 class="title" id="view-title">Your feed</h1>
    </header>

<div class="rail" id="sport-rail">
  <button class="chip" data-sport-filter="all" aria-pressed="true">All</button>
  <button class="chip" data-sport-filter="football" data-sport="football" aria-pressed="false">Football</button>
  <button class="chip" data-sport-filter="cricket" data-sport="cricket" aria-pressed="false">Cricket</button>
  <button class="chip" data-sport-filter="golf" data-sport="golf" aria-pressed="false">Golf</button>
  <button class="chip" data-sport-filter="gym" data-sport="gym" aria-pressed="false">Gym</button>
</div>

<div id="match-list"></div>

    <div id="match-list"></div>

    <form id="match-form"></form>

<nav class="tabs" id="tab-bar">
  <a href="#" class="tab-btn" data-mode="feed" aria-current="page">Feed</a>
  <a href="#" class="tab-btn" data-mode="insights">Insights</a>
  <button class="log" id="add-match-btn" aria-label="Log an activity">+</button>
  <a href="#" class="tab-btn" data-mode="teams">Teams</a>
  <a href="#" class="tab-btn" data-mode="me">Me</a>
</nav>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="golf.js"></script>
<script src="gym.js"></script>
<script src="teams.js"></script>
<script src="script.js"></script>
</body>
</html>
